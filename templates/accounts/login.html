{% extends "base.html" %}
{% block title %}{{ t.login_title }}{% endblock %}
{% block body %}
<div class="auth-shell">
  <div class="auth-panel">
    <div class="auth-panel-top">
      <div class="brand">AI Assistant</div>
      {% include "partials/lang_switcher.html" %}
    </div>
    <p class="muted" style="margin-top:0;">{{ t.login_lead }}</p>
    {% if error %}<div class="form-error">{{ error }}</div>{% endif %}

    <a class="btn btn-primary" style="width:100%;margin-top:1rem;" href="{% url 'accounts:instagram_login' %}">
      {{ t.login_cta }}
    </a>
  </div>
</div>
{% endblock %}
